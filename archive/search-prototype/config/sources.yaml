# Data sources configuration
# SCRAPE: NDIS Data Aggregator

sources:
  # NDIA Accountability Project - External Submissions
  - name: "NDIA Accountability - Submissions"
    type: "website"
    url: "https://ndiaaccountability.org/library/external-submissions/"
    enabled: true
    schedule: "0 1 * * *"  # Daily at 1am
    selectors:
      documents: "li"            # Each submission is a list item
      title: "strong, h3, h2"     # Submission title
      content: "span, p"          # Submission details
      url: "a[href]"              # Link to full submission
    headers:
      User-Agent: "SCRAPE-Bot/1.0 (+https://github.com/ksouth/SCRAPE)"
    timeout: 30

  # NDIA Accountability Project - FOI Documents
  - name: "NDIA Accountability - Documents"
    type: "website"
    url: "https://ndiaaccountability.org/library/documents/"
    enabled: true
    schedule: "0 2 * * *"  # Daily at 2am
    selectors:
      documents: "div, li"        # Document containers
      title: "h2, h3, strong"      # Document title
      content: "p"                 # Document description
      url: "a[href*='/library/']"  # Link to document
    headers:
      User-Agent: "SCRAPE-Bot/1.0 (+https://github.com/ksouth/SCRAPE)"
    timeout: 30

  # NDIS Decoded - Blog & Glossary
  # Note: This site uses JavaScript rendering - may need Selenium/Playwright
  - name: "NDIS Decoded - Blog"
    type: "website"
    url: "https://decodendis.pplx.app/blog"
    enabled: false  # Disabled - requires JS rendering
    schedule: "0 3 * * 0"  # Weekly Sunday at 3am
    selectors:
      documents: "article"
      title: "h1, h2"
      content: "p"
      url: "a[href*='/blog']"
    headers:
      User-Agent: "SCRAPE-Bot/1.0 (+https://github.com/ksouth/SCRAPE)"
    timeout: 30

# Processing configuration
processing:
  chunk_size: 512              # Characters per chunk
  chunk_overlap: 100           # Overlap between chunks
  embedding_model: "all-MiniLM-L6-v2"  # HuggingFace model
  use_openai: false            # Use OpenAI API for embeddings
  ocr_enabled: true            # Enable OCR for PDFs
  ocr_lang: "eng"              # Tesseract language

# Storage configuration
storage:
  vector_db: "chroma"
  chroma_host: "localhost"
  chroma_port: 8000
  collection_name: "documents"

# Logging
logging:
  level: "INFO"
  format: "json"
  file: "logs/scraper.log"
