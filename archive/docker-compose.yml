version: "3.8"

services:
  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: scrape-chroma
    ports:
      - "8000:8000"
    environment:
      IS_PERSISTENT: "true"
      PERSIST_DIRECTORY: "/chroma/data"
      CHROMA_SERVER_AUTH_PROVIDER: "none"
    volumes:
      - chroma_data:/chroma/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: scrape-api
    ports:
      - "8001:8000"
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      DEBUG: "true"
    depends_on:
      chroma:
        condition: service_healthy
    volumes:
      - ./api:/app/api
      - ./scraper:/app/scraper
      - ./processor:/app/processor
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  chroma_data:
